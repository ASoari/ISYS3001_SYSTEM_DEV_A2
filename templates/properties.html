<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dunbar Vet Clinic - Properties</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
    <div class="container">
        <h2>Add Rural Property</h2>
        <form action="/properties" method="POST" class="card p-3 mb-4">
            <div class="mb-3">
                <label>Select Client</label>
                <select name="client_id" class="form-select" required>
                    {% for c in clients %}
                        <option value="{{ c[0] }}">{{ c[1] }} ({{ c[2] }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label>Property Name / Address</label>
                <input type="text" name="property_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Locality / PIC Code</label>
                <input type="text" name="locality_pic" class="form-control" placeholder="e.g. PIC-NSW-12345" required>
            </div>
            <div class="mb-3">
                <label>Gate Access / Safety Notes</label>
                <textarea name="gate_access_notes" class="form-control" placeholder="Gate code #4021, beware of guard dog"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Property</button>
        </form>

        <h3>Registered Properties</h3>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Client</th>
                    <th>Property Name</th>
                    <th>Locality / PIC</th>
                    <th>Gate Access Notes</th>
                </tr>
            </thead>
            <tbody>
                {% for p in properties %}
                <tr>
                    <td>{{ p[4] }}</td>
                    <td>{{ p[1] }}</td>
                    <td><span class="badge bg-secondary">{{ p[2] }}</span></td>
                    <td><strong class="text-danger">{{ p[3] }}</strong></td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="text-center">No properties registered yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>

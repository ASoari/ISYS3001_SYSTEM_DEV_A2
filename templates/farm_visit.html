<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Farm Visit - Dunbar Vet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Book Farm Visit (US2)</h2>
            <a href="/properties" class="btn btn-outline-secondary">Manage Properties</a>
        </div>
        
        <form action="/farm-visit/book" method="POST" class="card p-4 mb-4">
            <div class="mb-3">
                <label>Select Property</label>
                <select name="property_id" class="form-select" required>
                    {% for p in properties %}
                        <option value="{{ p[0] }}">{{ p[1] }} (PIC: {{ p[2] }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label>Visit Date</label>
                    <input type="date" name="visit_date" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label>Start Time</label>
                    <input type="time" name="start_time" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label>Duration (Hours)</label>
                    <input type="number" step="0.5" name="duration_hours" class="form-control" value="1.0" required>
                </div>
            </div>
            <div class="mb-3">
                <label>Visit Notes</label>
                <textarea name="notes" class="form-control" placeholder="Routine livestock check-up"></textarea>
            </div>
            <button type="submit" class="btn btn-success">Schedule Farm Visit</button>
        </form>

        <h3>Scheduled Farm Visits</h3>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Property</th>
                    <th>Date</th>
                    <th>Start Time</th>
                    <th>Duration</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody>
                {% for v in visits %}
                <tr>
                    <td>{{ v[1] }}</td>
                    <td>{{ v[2] }}</td>
                    <td>{{ v[3] }}</td>
                    <td>{{ v[4] }} hrs</td>
                    <td>{{ v[5] }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center">No farm visits scheduled yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
